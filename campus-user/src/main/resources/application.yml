server:
  port: 8081

spring:
  application:
    name: campus-user
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  datasource:
    url: jdbc:mysql://localhost:3306/campus_user_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: campus1234

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

jwt:
  # user 与 gateway 必须使用相同的 secret；生产环境应通过环境变量/配置中心注入。
  secret: campus-trade-jwt-secret-key-change-me-in-production-0123456789
  expiration: 86400000

server:
  port: 8080

# jwt.secret / jwt.expiration 现由 Nacos 配置中心的 campus-shared.yaml 提供（见下方 spring.config.import），
# 与 campus-user 共享同一份配置，无需在两处各写一遍。

spring:
  application:
    name: campus-gateway
  config:
    import: "optional:nacos:campus-shared.yaml"
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yaml
    gateway:
      routes:
        - id: campus-user
          uri: lb://campus-user
          predicates:
            - Path=/user/**
        - id: campus-product
          uri: lb://campus-product
          predicates:
            - Path=/product/**
        - id: campus-order
          uri: lb://campus-order
          predicates:
            - Path=/order/**
        - id: campus-ai
          uri: lb://campus-ai
          predicates:
            - Path=/ai/**
        - id: campus-message
          uri: lb://campus-message
          predicates:
            - Path=/message/**

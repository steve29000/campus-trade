server:
  port: 8080

# 本地开发提供 JWT 兜底配置；Nacos campus-shared.yaml 或环境变量可覆盖这些值。
jwt:
  secret: ${JWT_SECRET:campus-trade-local-dev-secret-change-before-production-0123456789}
  expiration: ${JWT_EXPIRATION:86400000}

spring:
  application:
    name: campus-gateway
  config:
    import: "optional:nacos:campus-shared.yaml"
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yaml
    gateway:
      routes:
        - id: campus-user
          uri: lb://campus-user
          predicates:
            - Path=/user/**
        - id: campus-product
          uri: lb://campus-product
          predicates:
            - Path=/product/**
        - id: campus-order
          uri: lb://campus-order
          predicates:
            - Path=/order/**
        - id: campus-ai
          uri: lb://campus-ai
          predicates:
            - Path=/ai/**
        - id: campus-message
          uri: lb://campus-message
          predicates:
            - Path=/message/**

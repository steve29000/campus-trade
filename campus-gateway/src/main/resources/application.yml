server:
  port: 8080

jwt:
  # 必须与 campus-user 的 jwt.secret 保持一致。
  secret: campus-trade-jwt-secret-key-change-me-in-production-0123456789
  expiration: 86400000

spring:
  application:
    name: campus-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      routes:
        - id: campus-user
          uri: lb://campus-user
          predicates:
            - Path=/user/**
        - id: campus-product
          uri: lb://campus-product
          predicates:
            - Path=/product/**
        - id: campus-order
          uri: lb://campus-order
          predicates:
            - Path=/order/**
        - id: campus-ai
          uri: lb://campus-ai
          predicates:
            - Path=/ai/**
        - id: campus-message
          uri: lb://campus-message
          predicates:
            - Path=/message/**

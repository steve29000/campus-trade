# 本地联调中间件：MySQL + Redis + Nacos。
# 后端 Java 服务从后端分支（如 backend/m2-gaps）用 Maven 启动，连接这些中间件。
# 用法见 deploy/README.md。
#   docker compose -f deploy/docker-compose.yml up -d

services:
  mysql:
    image: mysql:8.0
    container_name: campus-mysql
    environment:
      MYSQL_ROOT_PASSWORD: campus1234
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      # 容器首次初始化时自动建库建表（campus_user_db / product / order / message）
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - campus-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcampus1234"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: campus-redis
    ports:
      - "6379:6379"
    volumes:
      - campus-redis-data:/data

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: campus-nacos
    environment:
      MODE: standalone
    ports:
      - "8848:8848" # 控制台 / OpenAPI
      - "9848:9848" # gRPC

volumes:
  campus-mysql-data:
  campus-redis-data:
